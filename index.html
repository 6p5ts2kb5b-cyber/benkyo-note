<style>
/* Layout: one-column table of contents on grid paper, grouped by grade */
:root{
  --paper:#eef3f6; --grid:#d5e1e8; --sheet:#fbfdfe; --ink:#1f3350; --sub:#5d6f82; --line:#c9d6df; --accent:#2f6fa8;
  --f-num:"Klee One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{

body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
.wrap{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:28px 40px;display:flex;flex-direction:column;gap:10px}
h1{font-size:1.4rem;margin:0 0 4px}
.lead{margin:0 0 6px;color:var(--sub);font-size:.95rem}
.group{font-size:.8rem;letter-spacing:.08em;color:var(--sub);margin:14px 0 0}
a.item{display:flex;justify-content:space-between;align-items:center;gap:12px;text-decoration:none;color:var(--ink);
  background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
a.item:hover{border-color:var(--accent)}
a.item:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a.item b{font-size:1.05rem}
a.item span{font-family:var(--f-num);color:var(--sub);font-size:.9rem;white-space:nowrap}
</style>
</head>
