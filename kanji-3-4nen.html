html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
.wrap{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:20px 28px;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.3rem;margin:0;text-wrap:balance}
.lead{margin:0;color:var(--sub);font-size:.95rem;line-height:1.6}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:18px}
.units{display:flex;flex-direction:column;gap:10px}
.group{font-size:.8rem;letter-spacing:.08em;color:var(--sub);margin:8px 0 -2px}
.unit{display:flex;align-items:center;gap:10px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:12px 12px 12px 16px}
.unit .name{flex:1;min-width:0}
.unit b{display:block;font-size:1.05rem}
.unit small{display:block;color:var(--sub);font-family:var(--f-kanji);font-size:.95rem;letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode{font:inherit;font-weight:700;font-size:.95rem;padding:10px 12px;border-radius:8px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;white-space:nowrap}
.mode:hover{background:var(--key)}
.mode:focus-visible,.btn:focus-visible,.choice:focus-visible,.link:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.95rem;color:var(--sub)}
.link{background:none;border:none;color:var(--sub);font:inherit;text-decoration:underline;cursor:pointer;padding:4px}
.bar{height:6px;background:var(--key);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.ask{text-align:center;color:var(--sub);margin:0 0 6px;font-size:.95rem}
.sent{font-family:var(--f-kanji);font-size:clamp(1.5rem,7vw,1.9rem);text-align:center;line-height:1.9;padding-block:10px;text-wrap:balance}
.tg{font-weight:600;font-size:1.35em;border-bottom:3px solid var(--ink);padding:0 .1em;margin:0 .1em;background:linear-gradient(transparent 62%,var(--mark) 62%)}
.fb{min-height:2.2em;text-align:center;font-size:1.05rem;font-weight:700}
.fb.ok{color:var(--ok)} .fb.ng{color:var(--ng)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{font-family:var(--f-kanji);font-weight:600;font-size:1.35rem;padding:16px 6px;border-radius:10px;border:2px solid transparent;background:var(--key);color:var(--ink);cursor:pointer;touch-action:manipulation;min-width:0;overflow-wrap:anywhere}
.choice.big{font-size:1.9rem;padding:12px 6px}
.choice.ok{border-color:var(--ok);color:var(--ok)}
.choice.ng{border-color:var(--ng);color:var(--ng);text-decoration:line-through}
.choice:disabled{cursor:default}
.btn{font:inherit;font-weight:700;font-size:1.1rem;padding:14px;border-radius:10px;border:none;background:var(--accent);color:var(--accent-ink);cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn:disabled{opacity:.45;cursor:default}

.done h2{font-size:1.6rem;margin:0 0 6px;text-align:center;text-wrap:balance}
.done .msg{text-align:center;margin:0;color:var(--sub);line-height:1.7}
.score{font-family:var(--f-kanji);font-size:2.4rem;text-align:center;font-weight:600;margin:10px 0 0;font-variant-numeric:tabular-nums}
.score small{font-size:1.1rem;color:var(--sub)}

.review ruby rt{font-size:.6em;color:var(--sub)}
.review .your{color:var(--ng);font-size:.95rem;white-space:nowrap}
.row{display:flex;flex-direction:column;gap:10px}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
.home-link{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:0 24px;font-size:.9rem}
.home-link a{color:var(--sub)}
body{margin:0}
</style>

/* 1・2年の 漢字（かきの まちがい用に つかう） */
const LOWER = "一右雨円王音下火花貝学気九休玉金空月犬見五口校左三山子四糸字耳七車手十出女小上森人水正生青夕石赤千川先早草足村大男竹中虫町天田土二日入年白八百文木本名目立力林六引羽雲園遠何科夏家歌画回会海絵外角楽活間丸岩顔汽記帰弓牛魚京強教近兄形計元言原戸古午後語工公広交光考行高黄合谷国黒今才細作算止市矢姉思紙寺自時室社弱首秋週春書少場色食心新親図数西声星晴切雪船線前組走多太体台地池知茶昼長鳥朝直通弟店点電刀冬当東答頭同道読内南肉馬売買麦半番父風分聞米歩母方北毎妹万明鳴毛門夜野友用曜来里理話";

const parse = t => t.trim().split("\n").map(l=>{const [k,w,y,s]=l.split("|");return {k,w,y,s}});
const K3 = parse(G3), K4 = parse(G4);

/* にている 漢字（かきの もんだいの まちがい用） */
const SIM = ["待持特時寺詩等","暑者都","湯陽場","板坂阪飯","福副富","植直置","速連運進遠","暗音意","終紙級絵結給続","昔借","問聞間関開","緑録","清晴静青","練線","園遠","課果菜","倍部","筆書","章早","氷水泳","旅族旗","酒配","薬楽","鉄鏡","箱相想","談話読","港洋","動働重","様横","未末","失矢夫天","径軽","郡群君","官管館","票標","低底","札礼","健建","季委","達幸","治始","漁魚","浅残","積績","鹿塩","英映","観親","議説談","願頭顔","側測","束東","便使","反板","皮波","悲非","洋羊","列例","息自","等待","短知","柱住注主"];
const simOf = k => { const g = SIM.find(s=>s.includes(k)); return g ? [...g].filter(c=>c!==k) : [] };

const r = (a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick = a=>a[Math.floor(Math.random()*a.length)];
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=r(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};

/* よみの まちがえやすい かたち：だくてん・のばす音・小さい っ */
const DAKU = {か:"が",き:"ぎ",く:"ぐ",け:"げ",こ:"ご",さ:"ざ",し:"じ",す:"ず",せ:"ぜ",そ:"ぞ",た:"だ",ち:"ぢ",つ:"づ",て:"で",と:"ど",は:"ば",ひ:"び",ふ:"ぶ",へ:"べ",ほ:"ぼ"};
const UNDAKU = Object.fromEntries(Object.entries(DAKU).map(([a,b])=>[b,a]));
function mutations(y){
  const out = new Set();
  [...y].forEach((c,i)=>{
    if(DAKU[c]) out.add(y.slice(0,i)+DAKU[c]+y.slice(i+1));
    if(UNDAKU[c]) out.add(y.slice(0,i)+UNDAKU[c]+y.slice(i+1));
  });
  if(y.includes("っ")) out.add(y.replace("っ","つ"));
  if(/[おこそとのほもよろごぞどぼょ]う/.test(y)) out.add(y.replace(/([おこそとのほもよろごぞどぼょ])う/,"$1"));
  if(y.includes("ゅう")) out.add(y.replace("ゅう","ゅ"));
  if(y.includes("ゃ")) out.add(y.replace("ゃ","や"));
  out.delete(y);
  return [...out];
}

function readQ(it, pool){
  const opts = new Set([it.y]);
  for(const m of shuffle(mutations(it.y))){ if(opts.size>=2) break; opts.add(m) }
  const others = shuffle(pool.filter(o=>o.k!==it.k && o.y!==it.y));
  const near = others.filter(o=>o.w.includes(it.k) || Math.abs(o.y.length-it.y.length)<=1);
  for(const o of [...near, ...others]){ if(opts.size>=4) break; opts.add(o.y) }
  return {mode:"yomi", it, choices:shuffle([...opts]), ans:it.y};
}
function writeQ(it, pool){
  const allowed = new Set([...pool.map(o=>o.k), ...LOWER, ...(pool===K4?K3.map(o=>o.k):[])]);
  const opts = new Set([it.w]);
  for(const c of shuffle(simOf(it.k).filter(c=>allowed.has(c)))){ if(opts.size>=4) break; opts.add(it.w.replace(it.k,c)) }
  for(const o of shuffle(pool)){ if(opts.size>=4) break; if(o.k!==it.k) opts.add(it.w.replace(it.k,o.k)) }
  return {mode:"kaki", it, choices:shuffle([...opts]), ans:it.w};
}

const UNITS = [
  {group:"3年生の 漢字（200字）"},
  {id:"3a", title:"3年 その1", list:K3.slice(0,40), pool:K3},
  {id:"3b", title:"3年 その2", list:K3.slice(40,80), pool:K3},
  {id:"3c", title:"3年 その3", list:K3.slice(80,120), pool:K3},
  {id:"3d", title:"3年 その4", list:K3.slice(120,160), pool:K3},
  {id:"3e", title:"3年 その5", list:K3.slice(160), pool:K3},
  {id:"3all", title:"3年 ぜんぶ", list:K3, pool:K3},
  {group:"4年生の 漢字（202字）"},
  {id:"4a", title:"4年 その1", list:K4.slice(0,40), pool:K4},
  {id:"4b", title:"4年 その2", list:K4.slice(40,80), pool:K4},
  {id:"4c", title:"4年 その3", list:K4.slice(80,120), pool:K4},
  {id:"4d", title:"4年 その4", list:K4.slice(120,160), pool:K4},
  {id:"4e", title:"4年 その5", list:K4.slice(160), pool:K4},
  {id:"4all", title:"4年 ぜんぶ", list:K4, pool:K4},
];

let s = {};
const app = document.getElementById("app");

function home(){
  s = {};
  app.innerHTML = `
    <h1>漢字ノート 3・4年</h1>
    <p class="lead">「よみ」は 漢字の読み方、「かき」は 正しい 漢字を 選ぶ 問題です。1回 ${TOTAL}問。</p>
    <div class="units">${UNITS.map(u=>u.group
      ? `<div class="group">${u.group}</div>`
      : `<div class="unit"><div class="name"><b>${u.title}</b><small>${u.list.map(i=>i.k).join("")}</small></div>
           <button class="mode" data-id="${u.id}" data-m="yomi">よみ</button>
           <button class="mode" data-id="${u.id}" data-m="kaki">かき</button></div>`).join("")}
    </div>`;
  app.querySelectorAll(".mode").forEach(b=>b.onclick=()=>start(b.dataset.id,b.dataset.m));
}

function start(id, mode){
  const u = UNITS.find(x=>x.id===id);
  const items = shuffle(u.list).slice(0,TOTAL);
  const qs = items.map(it=> mode==="yomi" ? readQ(it,u.pool) : writeQ(it,u.pool));
  s = {u, mode, qs, i:0, ok:0, miss:[], locked:false};
  draw();
}

function sentence(q){
  const word = q.mode==="yomi" ? q.it.w : q.it.y;
  return q.it.s.replace("＿", `<span class="tg">${word}</span>`);
}

function draw(){
  const q = s.qs[s.i];
  app.innerHTML = `
    <div class="top"><button class="link" id="quit">やめる</button><span>${s.u.title}・${s.mode==="yomi"?"よみ":"かき"}</span><span>${s.i+1} / ${TOTAL}</span></div>
    <div class="bar"><i style="width:${s.i/TOTAL*100}%"></i></div>
    <div class="sheet">
      <p class="ask">${q.mode==="yomi" ? "線の ところの 読み方は？" : "線の ところを 漢字で 書くと？"}</p>
      <div class="sent">${sentence(q)}</div>
      <div class="fb" id="fb"></div>
    </div>
    <div class="choices">${q.choices.map(c=>`<button class="choice ${q.mode==="kaki"?"big":""}" data-c="${c}">${c}</button>`).join("")}</div>
    <button class="btn" id="go" disabled>つぎへ</button>`;
  app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>choose(b));
  document.getElementById("go").onclick=()=>{ if(s.locked) next() };
  document.getElementById("quit").onclick=home;
}

function choose(btn){
  if(s.locked) return;
  const q=s.qs[s.i], c=btn.dataset.c, fb=document.getElementById("fb");
  s.locked=true;
  app.querySelectorAll(".choice").forEach(b=>{b.disabled=true; if(b.dataset.c===q.ans) b.classList.add("ok")});
  if(c===q.ans){ s.ok++; fb.className="fb ok"; fb.textContent="正解"; }
  else { btn.classList.add("ng"); s.miss.push({q, your:c}); fb.className="fb ng"; fb.textContent=`答えは「${q.ans}」`; }
  const go=document.getElementById("go"); go.disabled=false; go.textContent=s.i+1<TOTAL?"つぎへ":"おわり"; go.focus();
}

function next(){
  s.i++; s.locked=false;
  s.i<TOTAL ? draw() : done();
}

function done(){
  const ok=s.ok;
  const msg = ok===TOTAL ? "全問正解！漢字を よく 覚えているね。"
    : ok>=7 ? "よくできました。まちがえた 漢字を もう一度 見直そう。"
    : "最後まで あきらめずに できたね。くり返すと どんどん 覚えられるよ。";
  app.innerHTML = `
    <div class="sheet done">
      <h2>頑張ったね！</h2>
      <p class="msg">${msg}</p>
      <p class="score">${ok}<small> / ${TOTAL} 問</small></p>
    </div>
    ${s.miss.length?`<div class="sheet">
      <div class="group" style="margin:0 0 10px">見なおし</div>
      <ul class="review">${s.miss.map(m=>`<li><span><ruby>${m.q.it.w}<rt>${m.q.it.y}</rt></ruby></span><span class="your">（${m.your}）</span></li>`).join("")}</ul>
    </div>`:""}
    <div class="row">
      <button class="btn" id="again">もう一度 やる</button>
      <button class="btn ghost" id="back">ほかの 問題を 選ぶ</button>
    </div>`;
  const id=s.u.id, mode=s.mode;
  document.getElementById("again").onclick=()=>start(id,mode);
  document.getElementById("back").onclick=home;
}

document.addEventListener("keydown",e=>{
  if(e.key==="Enter" && s.qs && s.locked){ e.preventDefault(); next(); }
});

home();
