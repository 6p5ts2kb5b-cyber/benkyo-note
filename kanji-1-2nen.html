const parse = t => t.trim().split("\n").map(l=>{const [k,w,y,s]=l.split("|");return {k,w,y,s}});

/* にている 漢字（かきの もんだいの まちがい用） */
const SIM = ["人入八大太犬天","日目白百自","木本林森休体","土王玉","右石左古","力刀万方","千午牛","気汽","門間聞","読語話記","早草","夕名多外","先生","見貝","東車","雨雲電雪","田町男","子字学","今会","時寺","教考","近遠道通週","姉妹","兄元光","海毎母","鳥鳴","明朝","買売","分切","内肉","紙組線細糸","秋科","米来","引弓弱強","顔頭","西四","小少","上止正","新親","地池","里理野","晴青","国図回","星生","昼書"];
const simOf = k => { const g = SIM.find(s=>s.includes(k)); return g ? [...g].filter(c=>c!==k) : [] };

const r = (a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick = a=>a[Math.floor(Math.random()*a.length)];
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=r(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};

/* よみの まちがえやすい かたち：だくてん・のばす音・小さい っ */
const DAKU = {か:"が",き:"ぎ",く:"ぐ",け:"げ",こ:"ご",さ:"ざ",し:"じ",す:"ず",せ:"ぜ",そ:"ぞ",た:"だ",ち:"ぢ",つ:"づ",て:"で",と:"ど",は:"ば",ひ:"び",ふ:"ぶ",へ:"べ",ほ:"ぼ"};
const UNDAKU = Object.fromEntries(Object.entries(DAKU).map(([a,b])=>[b,a]));
function mutations(y){
  const out = new Set();
  [...y].forEach((c,i)=>{
    if(DAKU[c]) out.add(y.slice(0,i)+DAKU[c]+y.slice(i+1));
    if(UNDAKU[c]) out.add(y.slice(0,i)+UNDAKU[c]+y.slice(i+1));
  });
  if(y.includes("っ")) out.add(y.replace("っ","つ"));
  if(/[おこそとのほもよろごぞどぼょ]う/.test(y)) out.add(y.replace(/([おこそとのほもよろごぞどぼょ])う/,"$1"));
  if(y.includes("ゅう")) out.add(y.replace("ゅう","ゅ"));
  if(y.includes("ゃ")) out.add(y.replace("ゃ","や"));
  out.delete(y);
  return [...out];
}

function readQ(it, pool){
  const opts = new Set([it.y]);
  for(const m of shuffle(mutations(it.y))){ if(opts.size>=2) break; opts.add(m) }
  const others = shuffle(pool.filter(o=>o.k!==it.k && o.y!==it.y));
  const near = others.filter(o=>o.w.includes(it.k) || Math.abs(o.y.length-it.y.length)<=1);
  for(const o of [...near, ...others]){ if(opts.size>=4) break; opts.add(o.y) }
  return {mode:"yomi", it, choices:shuffle([...opts]), ans:it.y};
}
function writeQ(it, pool){
  const allowed = new Set(pool.map(o=>o.k));
  const opts = new Set([it.w]);
  for(const c of shuffle(simOf(it.k).filter(c=>allowed.has(c)))){ if(opts.size>=4) break; opts.add(it.w.replace(it.k,c)) }
  for(const o of shuffle(pool)){ if(opts.size>=4) break; if(o.k!==it.k) opts.add(it.w.replace(it.k,o.k)) }
  return {mode:"kaki", it, choices:shuffle([...opts]), ans:it.w};
}

const UNITS = [
  {group:"1年生の 漢字（80字）"},
  {id:"1a", title:"1年 その1", list:K1.slice(0,40), pool:K1},
  {id:"1b", title:"1年 その2", list:K1.slice(40), pool:K1},
  {id:"1all", title:"1年 ぜんぶ", list:K1, pool:K1},
  {group:"2年生の 漢字（160字）"},
  {id:"2a", title:"2年 その1", list:K2.slice(0,40), pool:K2},
  {id:"2b", title:"2年 その2", list:K2.slice(40,80), pool:K2},
  {id:"2c", title:"2年 その3", list:K2.slice(80,120), pool:K2},
  {id:"2d", title:"2年 その4", list:K2.slice(120), pool:K2},
  {id:"2all", title:"2年 ぜんぶ", list:K2, pool:K2},
];

let s = {};
const app = document.getElementById("app");

function home(){
  s = {};
  app.innerHTML = `
    <h1>漢字ノート 1・2年</h1>
    <p class="lead">「よみ」は 漢字の よみかた、「かき」は ただしい 漢字を えらぶ もんだいです。1回 ${TOTAL}もん。</p>
    <div class="units">${UNITS.map(u=>u.group
      ? `<div class="group">${u.group}</div>`
      : `<div class="unit"><div class="name"><b>${u.title}</b><small>${u.list.map(i=>i.k).join("")}</small></div>
           <button class="mode" data-id="${u.id}" data-m="yomi">よみ</button>
           <button class="mode" data-id="${u.id}" data-m="kaki">かき</button></div>`).join("")}
    </div>`;
  app.querySelectorAll(".mode").forEach(b=>b.onclick=()=>start(b.dataset.id,b.dataset.m));
}

function start(id, mode){
  const u = UNITS.find(x=>x.id===id);
  const items = shuffle(u.list).slice(0,TOTAL);
  const qs = items.map(it=> mode==="yomi" ? readQ(it,u.pool) : writeQ(it,u.pool));
  s = {u, mode, qs, i:0, ok:0, miss:[], locked:false};
  draw();
}

function sentence(q){
  const word = q.mode==="yomi" ? q.it.w : q.it.y;
  return q.it.s.replace("＿", `<span class="tg">${word}</span>`);
}

function draw(){
  const q = s.qs[s.i];
  app.innerHTML = `
    <div class="top"><button class="link" id="quit">やめる</button><span>${s.u.title}・${s.mode==="yomi"?"よみ":"かき"}</span><span>${s.i+1} / ${TOTAL}</span></div>
    <div class="bar"><i style="width:${s.i/TOTAL*100}%"></i></div>
    <div class="sheet">
      <p class="ask">${q.mode==="yomi" ? "せんの ところの よみかたは？" : "せんの ところを 漢字で かくと？"}</p>
      <div class="sent">${sentence(q)}</div>
      <div class="fb" id="fb"></div>
    </div>
    <div class="choices">${q.choices.map(c=>`<button class="choice ${q.mode==="kaki"?"big":""}" data-c="${c}">${c}</button>`).join("")}</div>
    <button class="btn" id="go" disabled>つぎへ</button>`;
  app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>choose(b));
  document.getElementById("go").onclick=()=>{ if(s.locked) next() };
  document.getElementById("quit").onclick=home;
}

function choose(btn){
  if(s.locked) return;
  const q=s.qs[s.i], c=btn.dataset.c, fb=document.getElementById("fb");
  s.locked=true;
  app.querySelectorAll(".choice").forEach(b=>{b.disabled=true; if(b.dataset.c===q.ans) b.classList.add("ok")});
  if(c===q.ans){ s.ok++; fb.className="fb ok"; fb.textContent="せいかい"; }
  else { btn.classList.add("ng"); s.miss.push({q, your:c}); fb.className="fb ng"; fb.textContent=`こたえは「${q.ans}」`; }
  const go=document.getElementById("go"); go.disabled=false; go.textContent=s.i+1<TOTAL?"つぎへ":"おわり"; go.focus();
}

function next(){
  s.i++; s.locked=false;
  s.i<TOTAL ? draw() : done();
}

function done(){
  const ok=s.ok;
  const msg = ok===TOTAL ? "ぜんもん せいかい！漢字を よく おぼえているね。"
    : ok>=7 ? "よく できました。まちがえた 漢字を もういちど 見てみよう。"
    : "さいごまで あきらめずに できたね。くりかえすと どんどん おぼえられるよ。";
  app.innerHTML = `
    <div class="sheet done">
      <h2>がんばったね！</h2>
      <p class="msg">${msg}</p>
      <p class="score">${ok}<small> / ${TOTAL} もん</small></p>
    </div>
    ${s.miss.length?`<div class="sheet">
      <div class="group" style="margin:0 0 10px">見なおし</div>
      <ul class="review">${s.miss.map(m=>`<li><span><ruby>${m.q.it.w}<rt>${m.q.it.y}</rt></ruby></span><span class="your">（${m.your}）</span></li>`).join("")}</ul>
    </div>`:""}
    <div class="row">
      <button class="btn" id="again">もういちど やる</button>
      <button class="btn ghost" id="back">ほかの もんだいを えらぶ</button>
    </div>`;
  const id=s.u.id, mode=s.mode;
  document.getElementById("again").onclick=()=>start(id,mode);
  document.getElementById("back").onclick=home;
}

document.addEventListener("keydown",e=>{
  if(e.key==="Enter" && s.qs && s.locked){ e.preventDefault(); next(); }
});

home();
</script>
